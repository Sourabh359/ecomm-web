<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    {% include "topnav.html" %}
    {% include "header.html" %}
    <main>
        <div class="container">
            <nav class="breadcrumb">
                <ol class="flex">
                    <li><a href="/">Home</a></li>
                    <li><a href="/signup">Signup</a>
                </ol>
            </nav>
            <h1>{{title | title}}</h1>
            <div class="signup-card">
            <section class="signup-content text-center">
                <img src="img/user-plus.png" alt="logo" width="98" height="85">
                <h2>Create Your Account</h2>
                <p>Join us and explore our electronics collection.</p>
            </section>
            <form class="signup-form row">
                <label class="col-4">Full Name </label>
                <input class="col-8" type="text" placeholder="Enter your full name">
                <label class="col-4">Email Address </label>
                <input class="col-8" type="text" placeholder="Enter your email address">
                <label class="col-4">Password </label>
                <input class="col-8" type="text" placeholder="Create a password">
                <label class="col-4">Confirm Password </label>
                <input class="col-8" type="text" placeholder="Re-enter your password">
                <button class="col-12" type="button">Create Account</button>
            </form>
            <p class="text-center">Already have an account? <a href="">Log In</a></p>
            </div>
        </div>
    </main>

    {% include "footer.html" %}
    <script src="/js/jquery.min.js"></script>
    <script src="/js/common.js"></script>
</body>

</html>
